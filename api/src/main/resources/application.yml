# Rodar a partir de /api. As variáveis vêm do .env da raiz do repositório (ou do ambiente).
spring:
  application:
    name: contatos-api
  config:
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:contatos}
    username: ${POSTGRES_USER:contatos}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Falha rápido com o banco fora do ar (a verificação de saúde devolve 503 em vez de pendurar).
      connection-timeout: 5000
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  flyway:
    # Postgres é a fonte da verdade. Os testes usam db/migration/h2 (ver perfil test).
    locations: classpath:db/migration/postgres

server:
  # Só o proxy (nginx) acessa a API. Para testar pela rede local, defina SERVER_ADDRESS=0.0.0.0.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:3333}
  shutdown: graceful

app:
  token: ${API_TOKEN:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  retencao-excluidos-dias: 30
  limpeza-cron: "0 30 3 * * *"
  # Bloqueio por token errado: após N erros do mesmo IP, 429 por M minutos (vale até com o token certo).
  tentativas-maximas: 5
  bloqueio-minutos: 10
  # Cabeçalho com o IP real do cliente, definido (sobrescrito) pelo proxy. Vazio = IP da conexão.
  cabecalho-ip-cliente: ${CLIENT_IP_HEADER:}
