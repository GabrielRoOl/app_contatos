# Postgres só para desenvolvimento. Lê POSTGRES_* do .env da raiz.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contatos}
      POSTGRES_USER: ${POSTGRES_USER:-contatos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5431}:5432"
    volumes:
      - contatos-pgdata:/var/lib/postgresql/data

volumes:
  contatos-pgdata:
