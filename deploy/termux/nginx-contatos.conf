# Incluído dentro do bloco http do nginx.conf do Termux:
#   include /data/data/com.termux/files/home/contatos/nginx-contatos.conf;
# Serve a PWA e repassa /api para a API na porta 3333. Só escuta em 127.0.0.1: quem expõe é o túnel.
server {
  listen 127.0.0.1:8100;
  root /data/data/com.termux/files/home/contatos/web;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  }

  # service worker, shell e manifest nunca podem ficar em cache velho
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # arquivos com hash no nome
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ /index.html; }
}
